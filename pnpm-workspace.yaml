packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# --- Supply-chain hardening: WANTED, NOT YET ADOPTABLE ------------------------
# React Doctor flags this file for missing `minimumReleaseAge` and `trustPolicy`
# (rule react-doctor/require-pnpm-hardening, Security). Both are the right thing
# to want. Neither can be turned on against the CURRENT lockfile: each one makes
# `pnpm install --frozen-lockfile` exit 1, which is what Vercel runs, so enabling
# either would break every deploy. Verified on 2026-09-05, not assumed.
#
#   minimumReleaseAge: 10080     # 7 days, in minutes
#     -> [MINIMUM_RELEASE_AGE_VIOLATION] on next@16.3.4 and ~23 transitive
#        packages. Next was upgraded 2026-09-04 (508a666), so the lockfile is
#        full of releases younger than a week. This one ages out on its own:
#        enable it at a moment when nothing has just been bumped.
#        Ongoing cost: upgrading a package on release day then needs an override.
#
#   trustPolicy: no-downgrade
#     -> [ERR_PNPM_TRUST_DOWNGRADE] on 3 entries, reported as "possible package
#        takeover": eslint-import-resolver-typescript@3.10.1, semver@6.3.1,
#        undici-types@6.21.0. These are old pinned TRANSITIVE versions that
#        predate npm provenance attestations, so this is very likely the rule's
#        known false-positive shape rather than a real compromise — but "very
#        likely" is not a basis for waving through a takeover warning. Somebody
#        has to look at those three, then either `pnpm clean --lockfile &&
#        pnpm install` to resolve them fresh, or record why they are accepted.
#
# ─── Re-verified 2026-09-07, both still fail ──────────────────────────────
# `pnpm install --frozen-lockfile` with BOTH lines enabled exits 1 with 15
# failed entries. Measured, not assumed:
#
#   12x MINIMUM_RELEASE_AGE_VIOLATION  all of them next@16.3.4 and its @next/*
#       platform binaries. Newest publish 2026-08-31T19:56:52Z against a cutoff
#       of 2026-08-31T18:27:16Z -- ninety minutes short of seven days. This one
#       really does age out on its own, and it ages out TODAY. Re-run the check
#       later in the day and `minimumReleaseAge: 10080` should go in clean, as
#       long as nothing has been bumped in the meantime.
#
#       Measured a THIRD time later on 2026-09-07: same 12 entries, cutoff now
#       2026-08-31T19:02:03Z. Still short, by 55 minutes rather than ninety, so
#       it is closing exactly as predicted. The blocker is one package --
#       @next/swc-win32-x64-msvc@16.3.4, published 2026-08-31T19:56:52Z -- and
#       the line goes in clean once the cutoff passes that stamp, i.e. from
#       2026-09-07T19:57Z. Do not enable it before then: it exits 1 and Vercel
#       runs this command.
#
#    3x TRUST_DOWNGRADE               exactly the three named below, unchanged:
#       eslint-import-resolver-typescript@3.10.1, semver@6.3.1,
#       undici-types@6.21.0. These do not age out. Somebody has to either
#       resolve them fresh (`pnpm clean --lockfile && pnpm install`) or record
#       why they are accepted.
#
# Do not paste either line in without re-running `pnpm install --frozen-lockfile`
# first. That is the whole lesson of this comment.
